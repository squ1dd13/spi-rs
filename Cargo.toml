[package]
name = "spi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native SPI image decoder"
exclude = ["tests/local-corpus/**", ".codex/**"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:env_logger", "image/png"]

[[bin]]
name = "spi-decode"
path = "src/bin/spi-decode.rs"
required-features = ["cli"]

[dependencies]
binrw = "0.15"
bitstream-io = "4"
image = { version = "0.25", default-features = false }
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
proptest = "1"
